{% extends "base.html" %}
{% block title %}Register · SentimentIQ{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Create account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}

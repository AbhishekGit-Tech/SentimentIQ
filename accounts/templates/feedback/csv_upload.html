{% extends "base.html" %}
{% block title %}Upload CSV · SentimentIQ{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>Upload a CSV</h2>
  <form id="upload-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Upload &amp; analyse</button>
  </form>
  <p class="muted">Max {{ max_rows }} rows per file. The first upload can take a few extra seconds while the model loads.</p>
</div>
<script>
  document.getElementById("upload-form").addEventListener("submit", function () {
    var b = this.querySelector("button[type=submit]");
    b.disabled = true;
    b.textContent = "Analysing… please wait";
  });
</script>
{% endblock %}
